<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="8" fill="#eef1f6"/>
  <!-- Border -->
  <rect x="1" y="1" width="98" height="98" rx="7.5" fill="none" stroke="#dde3ec" stroke-width="1.5"/>
  <!-- Broken image icon -->
  <g transform="translate(50,40)" opacity="0.5">
    <rect x="-16" y="-14" width="32" height="26" rx="3" fill="none" stroke="#9ca3af" stroke-width="1.8"/>
    <polyline points="-16,6 -6,-2 2,4 16,-6" fill="none" stroke="#9ca3af" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="6" cy="-6" r="4" fill="none" stroke="#9ca3af" stroke-width="1.8"/>
    <!-- Crack lines -->
    <line x1="-3" y1="-14" x2="1" y2="-5" stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="1" y1="-5" x2="-1" y2="1" stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <!-- Text -->
  <text x="50" y="72" font-family="'DM Sans', 'Inter', sans-serif" font-size="7.5" font-weight="500" fill="#9ca3af" text-anchor="middle" letter-spacing="1">NO IMAGE</text>
  <text x="50" y="83" font-family="'DM Sans', 'Inter', sans-serif" font-size="7.5" font-weight="500" fill="#9ca3af" text-anchor="middle" letter-spacing="1">FOUND</text>
</svg>
